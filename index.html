    let db = null;
  let voters = [];
  let currentMode = "ALL";
  let tempSelections = {};

  // 1. Initialize IndexedDB and request browser persistence
  async function initDB() {
    // Request permanent browser storage so cache clears don't touch it
    if (navigator.storage && navigator.storage.persist) {
      await navigator.storage.persist();
    }

    return new Promise((resolve, reject) => {
      const request = indexedDB.open("VoterSurveyDB", 1);
      
      request.onerror = (event) => reject("IndexedDB error: " + event.target.error);
      
      request.onsuccess = (event) => {
        db = event.target.result;
        loadVotersFromDB(resolve);
      };

      request.onupgradeneeded = (event) => {
        const database = event.target.result;
        if (!database.objectStoreNames.contains("voters")) {
          database.createObjectStore("voters", { keyPath: "serial_number" });
        }
      };
    });
  }

  // Load voters from IndexedDB or fall back to initial hardcoded list
  function loadVotersFromDB(callback) {
    const transaction = db.transaction(["voters"], "readonly");
    const store = transaction.objectStore("voters");
    const request = store.getAll();

    request.onsuccess = (event) => {
      const storedVoters = event.target.result;
      if (storedVoters && storedVoters.length > 0) {
        voters = storedVoters;
      } else {
        // First run: populate database with initial hardcoded list
        voters = initialVoters.map(v => ({ ...v, status: "Unreviewed" }));
        saveAllVotersToDB(voters, () => {
          if (callback) callback();
        });
        return;
      }
      if (callback) callback();
      updateDashboardCounts();
    };
  }

  function saveAllVotersToDB(dataArray, callback) {
    const transaction = db.transaction(["voters"], "readwrite");
    const store = transaction.objectStore("voters");
    dataArray.forEach(voter => store.put(voter));
    transaction.oncomplete = () => {
      if (callback) callback();
    };
  }

  async function handleLogin() {
    const u = document.getElementById("username").value.trim();
    const p = document.getElementById("password").value.trim();
    if (u === VALID_USER && p === VALID_PASS) {
      document.getElementById("loginError").style.display = "none";
      document.getElementById("loginScreen").classList.add("hidden");
      document.getElementById("logoutBtn").classList.remove("hidden");
      
      // Initialize IndexedDB on successful login
      await initDB();
      showDashboard();
    } else {
      document.getElementById("loginError").style.display = "block";
    }
  }

  // 2. Update submitUpdates to save into IndexedDB instead of localStorage
  function submitUpdates() {
    const changedKeys = Object.keys(tempSelections);
    if (changedKeys.length === 0) {
      alert("No changes selected.");
      return;
    }

    voters = voters.map(v => {
      if (tempSelections[v.serial_number]) {
        return { ...v, status: tempSelections[v.serial_number] };
      }
      return v;
    });

    // Save batch changes permanently into IndexedDB
    const transaction = db.transaction(["voters"], "readwrite");
    const store = transaction.objectStore("voters");
    
    changedKeys.forEach(serial => {
      const updatedVoter = voters.find(v => v.serial_number == serial);
      if (updatedVoter) {
        store.put(updatedVoter);
      }
    });

    transaction.oncomplete = () => {
      tempSelections = {};
      alert(`Permanently updated ${changedKeys.length} voter(s)!`);
      showDashboard();
    };

    transaction.onerror = (e) => {
      alert("Error saving to permanent storage.");
    };
  }

  // 3. Update resetToDefault for IndexedDB
  function resetToDefault() {
    if (confirm("Reset all voter statuses?")) {
      const transaction = db.transaction(["voters"], "readwrite");
      const store = transaction.objectStore("voters");
      
      voters = voters.map(v => {
        const resetVoter = { ...v, status: "Unreviewed" };
        store.put(resetVoter);
        return resetVoter;
      });

      transaction.oncomplete = () => {
        updateDashboardCounts();
        alert("Data reset successfully.");
      };
    }
  }

    }
  }

  function handleLogin() {
    const u = document.getElementById("username").value.trim();
    const p = document.getElementById("password").value.trim();
    if (u === VALID_USER && p === VALID_PASS) {
      document.getElementById("loginError").style.display = "none";
      document.getElementById("loginScreen").classList.add("hidden");
      document.getElementById("logoutBtn").classList.remove("hidden");
      initData();
      showDashboard();
    } else {
      document.getElementById("loginError").style.display = "block";
    }
  }

  function logout() {
    document.getElementById("loginScreen").classList.remove("hidden");
    document.getElementById("dashboardScreen").classList.add("hidden");
    document.getElementById("listScreen").classList.add("hidden");
    document.getElementById("logoutBtn").classList.add("hidden");
  }

  function showDashboard() {
    document.getElementById("dashboardScreen").classList.remove("hidden");
    document.getElementById("listScreen").classList.add("hidden");
    updateDashboardCounts();
  }

  function updateDashboardCounts() {
    const total = voters.length;
    const fav = voters.filter(v => v.status === "Favour").length;
    const neu = voters.filter(v => v.status === "Neutral").length;
    const anti = voters.filter(v => v.status === "Anti").length;
    const del = voters.filter(v => v.status === "Deleted").length;
    const unrev = total - (fav + neu + anti + del);

    document.getElementById("countTotal").innerText = total;
    document.getElementById("countUnreviewed").innerText = `Unreviewed: ${unrev}`;
    document.getElementById("countFavour").innerText = fav;
    document.getElementById("countNeutral").innerText = neu;
    document.getElementById("countAnti").innerText = anti;
    document.getElementById("countDeleted").innerText = del;
  }

  function toggleImportBox() {
    document.getElementById("importBox").classList.toggle("hidden");
  }

  function importJSONData() {
    const raw = document.getElementById("jsonInput").value.trim();
    if (!raw) {
      alert("Please paste valid JSON array first.");
      return;
    }
    try {
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) {
        alert("JSON must be an array of voter objects.");
        return;
      }
      voters = parsed.map((v, idx) => ({
        section_no: v.section_no || v["Section no"] || 1,
        section_name: v.section_name || v["section name"] || "Govindapuram",
        serial_number: v.serial_number || v["serial number"] || (idx + 1),
        voter_id: v.voter_id || v["voter id"] || "",
        name: v.name || "",
        father_name: v.father_name || v["father name"] || "",
        age: v.age || "",
        gender: v.gender || "",
        status: v.status || "Unreviewed"
      }));
      localStorage.setItem("voters_survey_data_v1", JSON.stringify(voters));
      updateDashboardCounts();
      document.getElementById("jsonInput").value = "";
      document.getElementById("importBox").classList.add("hidden");
      alert(`Successfully loaded ${voters.length} voters!`);
    } catch (e) {
      alert("Invalid JSON format!");
    }
  }

  function resetToDefault() {
    if (confirm("Reset all voter statuses?")) {
      localStorage.removeItem("voters_survey_data_v1");
      initData();
      updateDashboardCounts();
      alert("Data reset.");
    }
  }

  function openReviewScreen() {
    currentMode = "ALL";
    tempSelections = {};
    document.getElementById("searchInput").value = "";
    document.getElementById("sectionFilter").value = "ALL";
    document.getElementById("listScreenTitle").innerText = "Review All Voters";
    document.getElementById("pdfBtn").classList.add("hidden");
    document.getElementById("dashboardScreen").classList.add("hidden");
    document.getElementById("listScreen").classList.remove("hidden");
    renderVoterList();
  }

  function openCategoryScreen(category) {
    currentMode = category;
    tempSelections = {};
    document.getElementById("searchInput").value = "";
    document.getElementById("sectionFilter").value = "ALL";
    document.getElementById("listScreenTitle").innerText = `${category} Voters List`;
    document.getElementById("pdfBtn").classList.remove("hidden");
    document.getElementById("dashboardScreen").classList.add("hidden");
    document.getElementById("listScreen").classList.remove("hidden");
    renderVoterList();
  }

  function renderVoterList() {
    const container = document.getElementById("voterListContainer");
    const query = document.getElementById("searchInput").value.toLowerCase();
    const secFilter = document.getElementById("sectionFilter").value;
    container.innerHTML = "";

    const filtered = voters.filter(v => {
      const matchesMode = (currentMode === "ALL") ? true : (v.status === currentMode);
      const matchesSec = (secFilter === "ALL") ? true : (String(v.section_no) === secFilter);
      const matchesSearch = String(v.name).toLowerCase().includes(query) ||
                            String(v.voter_id).toLowerCase().includes(query) ||
                            String(v.serial_number).includes(query);
      return matchesMode && matchesSec && matchesSearch;
    });

    if (filtered.length === 0) {
      container.innerHTML = "<p style='text-align:center; color:#64748b; padding: 20px 0;'>No voters found.</p>";
      return;
    }

    const allStatuses = ["Favour", "Neutral", "Anti", "Deleted"];

    filtered.forEach(voter => {
      const currentSelection = tempSelections[voter.serial_number] || voter.status;
      const div = document.createElement("div");
      div.className = "voter-item";
      
      let radiosHTML = "";
      allStatuses.forEach(st => {
        const checked = (currentSelection === st) ? "checked" : "";
        radiosHTML += `
          <label>
            <input type="radio" name="voter_${voter.serial_number}" value="${st}" ${checked}
              onchange="recordSelection(${voter.serial_number}, '${st}')">
            ${st}
          </label>
        `;
      });

      div.innerHTML = `
        <div class="voter-title">
          <span>#${voter.serial_number} - ${voter.name}</span>
          <span class="badge badge-${voter.status}">${voter.status}</span>
        </div>
        <div class="voter-sub">
          <strong>Voter ID:</strong> ${voter.voter_id} | <strong>Rel:</strong> ${voter.father_name}<br>
          <strong>Age:</strong> ${voter.age} | <strong>Gender:</strong> ${voter.gender} | <strong>Sec:</strong> ${voter.section_no}
        </div>
        <div class="radio-group">${radiosHTML}</div>
      `;
      container.appendChild(div);
    });
  }

  function recordSelection(serialNo, status) {
    tempSelections[serialNo] = status;
  }

  function submitUpdates() {
    const changedKeys = Object.keys(tempSelections);
    if (changedKeys.length === 0) {
      alert("No changes selected.");
      return;
    }
    voters = voters.map(v => {
      if (tempSelections[v.serial_number]) {
        return { ...v, status: tempSelections[v.serial_number] };
      }
      return v;
    });
    localStorage.setItem("voters_survey_data_v1", JSON.stringify(voters));
    tempSelections = {};
    alert(`Updated ${changedKeys.length} voter(s)!`);
    showDashboard();
  }

  function downloadCategoryPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const list = voters.filter(v => v.status === currentMode);

    if (list.length === 0) {
      alert(`No voters in ${currentMode} list.`);
      return;
    }

    doc.setFontSize(14);
    doc.text(`${currentMode} Voters List (Count: ${list.length})`, 14, 15);

    const tableRows = list.map(v => [
      v.serial_number,
      v.section_no,
      v.voter_id,
      v.name,
      v.father_name,
      v.age,
      v.gender,
      v.status
    ]);

    doc.autoTable({
      startY: 22,
      head: [['S.No', 'Sec', 'Voter ID', 'Name', 'Father/Husband', 'Age', 'Gender', 'Status']],
      body: tableRows,
      styles: { fontSize: 8 },
      headStyles: { fillColor: [30, 58, 138] }
    });

    doc.save(`${currentMode}_Voters_List.pdf`);
  }
</script>
</body>
</html>
